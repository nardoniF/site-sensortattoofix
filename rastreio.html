<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Rastreio | Sensor Tattoo Fix</title>
  <link rel="stylesheet" href="style.css?v=2.66">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .rastreio-page { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    .rastreio-card {
      background: #141414; border: 1px solid #333; border-radius: 16px;
      padding: 24px 22px; color: #eee;
    }
    .rastreio-code {
      font: 800 1.2rem/1.3 ui-monospace, monospace; color: var(--primary);
      letter-spacing: 0.04em; word-break: break-all; margin: 0;
    }
    .rastreio-links { margin-top: 20px; }
    .rastreio-links-title {
      margin: 0 0 10px; font-size: 0.95rem; font-weight: 700; color: #eee;
    }
    .rastreio-links-grid {
      display: grid; gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 480px) {
      .rastreio-links-grid.rastreio-links-grid--2 { grid-template-columns: repeat(2, 1fr); }
    }
    .rastreio-link-card {
      display: flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 14px 16px; border-radius: 10px;
      background: #1c1c1c; border: 1px solid #3a3a3a;
      color: var(--primary) !important; text-decoration: none;
      font-weight: 700; font-size: 1rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .rastreio-link-card:hover { border-color: var(--primary); background: #222; }
    .rastreio-error { color: #f88; margin-top: 16px; }
    .rastreio-back { display: inline-block; margin-bottom: 16px; color: var(--primary); text-decoration: none; }
  </style>
  <script src="js/config-bootstrap.js"></script>
</head>
<body class="admin-page">
  <main class="rastreio-page">
    <a href="index.html" class="rastreio-back"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
    <div class="rastreio-card">
      <h1 style="margin:0 0 12px;font-size:1.1rem;color:#fff"><i class="fas fa-truck"></i> Rastreio de encomenda</h1>
      <p id="rastreio-code" class="rastreio-code"></p>
      <div id="rastreio-links" class="rastreio-links" hidden></div>
      <p id="rastreio-error" class="rastreio-error" hidden></p>
    </div>
  </main>
  <script src="js/rastreio.js?v=6"></script>
</body>
</html>
