name: E2E i18n (DE/ES/PL)

on:
  push:
    branches: [main]
    paths:
      - 'de/**'
      - 'es/**'
      - 'pl/**'
      - 'sl/**'
      - 'js/**'
      - 'data/store-config.json'
      - 'e2e/**'
      - '.github/workflows/e2e-i18n.yml'
  pull_request:
    paths:
      - 'de/**'
      - 'es/**'
      - 'pl/**'
      - 'sl/**'
      - 'js/**'
      - 'data/store-config.json'
      - 'e2e/**'
      - '.github/workflows/e2e-i18n.yml'

jobs:
  e2e-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E deps
        working-directory: e2e
        run: |
          npm ci
          # --with-deps às vezes quebra no apt do Google Chrome (Hash Sum mismatch).
          # Tenta com deps; se falhar, sobe só o Chromium do Playwright (suficiente no ubuntu-latest).
          if ! npx playwright install chromium --with-deps; then
            echo "playwright --with-deps falhou; tentando sem deps do sistema…"
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* || true
            npx playwright install chromium
          fi
      - name: Run Playwright i18n tests
        working-directory: e2e
        run: npm test
