name: Deploy & Backfill

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-backfill.yml'

jobs:
  deploy-and-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (api)
        run: |
          cd api
          npm ci --prefer-offline --no-audit --no-fund

      - name: Deploy Worker (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Conta pública no wrangler.toml — secret CF_ACCOUNT_ID opcional
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '80ab4f6ff1553d2ee530c0880edce594' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure o secret CF_API_TOKEN (Workers Scripts Edit + KV + D1) em Settings → Secrets → Actions."
            exit 1
          fi
          cd api
          npx wrangler@4 deploy --config wrangler.toml
          cd ../cloudflare
          npx wrangler@4 deploy --config wrangler.toml

      - name: Backfill normalized (MercadoLivre)
        if: ${{ !contains(github.event.head_commit.message || '', '[skip-backfill]') }}
        env:
          BACKFILL_KEY: ${{ secrets.BACKFILL_KEY }}
        run: |
          # adjust channel/limit as needed
          RESPONSE=$(curl -s -X POST "https://api.sensortattoofix.com.br/admin/backfill-normalized?channel=mercadolivre&limit=5000&key=${BACKFILL_KEY}")
          echo "$RESPONSE"
