# Deploy estático — OPCIONAL.
# O site .com / .com.br é servido pelo Worker cloudflare/stf-com-proxy.js (pin COMMIT).
# GitHub Pages está com billing locked e gerava e-mail de falha a cada push.
# Dispare manualmente só se o Pages for reativado.

name: Deploy site (Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Site estático (sem Jekyll)
        run: touch .nojekyll

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url || steps.deploy4.outputs.page_url }}
    steps:
      - name: Publicar no Pages (tentativa 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes de retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Publicar no Pages (tentativa 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes de retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Publicar no Pages (tentativa 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes de retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: sleep 20

      - name: Publicar no Pages (tentativa 4)
        id: deploy4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Resultado
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy3.outcome }}" = "success" ] || [ "${{ steps.deploy4.outcome }}" = "success" ]; then
            echo "Pages OK"
            exit 0
          fi
          echo "::warning::GitHub Pages falhou (billing/lock). Site continua no Cloudflare proxy."
          exit 0
