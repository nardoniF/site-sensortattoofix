<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Manual + cupom — 6 por folha A4 (Sensor TattooFix)</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
            color: #111;
            background: #e8e8e8;
        }

        .no-print {
            text-align: center;
            padding: 14px;
            font-size: 13px;
            background: #fff;
            border-bottom: 1px solid #ccc;
        }

        .no-print p { margin-bottom: 8px; color: #444; max-width: 640px; margin-left: auto; margin-right: auto; }

        .no-print button,
        .no-print a.btn {
            display: inline-block;
            font: inherit;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            margin: 0 4px;
        }

        .no-print a.btn.secondary {
            background: #fff;
            color: #111;
            border: 1px solid #ccc;
        }

        @media print {
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 210mm;
                background: #fff;
                overflow: visible;
            }
            .no-print { display: none !important; }
            .sheet-lote {
                box-shadow: none;
                margin: 0 !important;
                width: 210mm;
                height: 297mm;
                max-height: 297mm;
                padding: 3mm;
                page-break-after: avoid;
                page-break-inside: avoid;
                overflow: hidden;
            }
            .tile { break-inside: avoid; page-break-inside: avoid; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* 6 cartões maiores: 2 colunas × 3 linhas — 1 folha só */
        .sheet-lote {
            width: 210mm;
            height: 297mm;
            margin: 10px auto 24px;
            padding: 3mm;
            background: #fff;
            box-shadow: 0 2px 16px rgba(0,0,0,.12);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 2mm;
        }

        .tile {
            border: 0.6pt dashed #999;
            padding: 2mm;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1.2mm;
            background: #fff;
            min-height: 0;
        }

        .tile-head {
            display: flex;
            align-items: center;
            gap: 2mm;
            border-bottom: 1pt solid #111;
            padding-bottom: 1.2mm;
            flex-shrink: 0;
        }

        .tile-head img {
            width: 11mm;
            height: 11mm;
            border-radius: 50%;
            object-fit: contain;
            background: #000;
            border: 0.6pt solid #111;
            flex-shrink: 0;
        }

        .tile-head h1 {
            font-size: 11pt;
            line-height: 1.05;
            font-weight: 900;
            color: #111;
            letter-spacing: 0.02em;
        }

        .tile-head h1 span { font-weight: 800; }

        .tile-head p {
            font-size: 6.5pt;
            color: #555;
            margin-top: 0.3mm;
        }

        .tile-body {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 1.5mm;
            flex: 1;
            min-height: 0;
            align-items: stretch;
        }

        .panel {
            border: 0.5pt solid #ccc;
            border-radius: 2px;
            padding: 1.2mm 1.4mm;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            background: #fff;
        }

        h2 {
            font-size: 7.5pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.8mm;
            padding-bottom: 0.4mm;
            border-bottom: 0.8pt solid #111;
            color: #111;
            flex-shrink: 0;
        }

        .kit {
            list-style: none;
            font-size: 7.2pt;
            line-height: 1.3;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            min-height: 0;
        }

        .kit li {
            padding-left: 4.2mm;
            position: relative;
        }

        .kit li::before {
            content: attr(data-n) ".";
            position: absolute;
            left: 0;
            font-weight: 900;
            color: #111;
        }

        .steps {
            list-style: none;
            counter-reset: s;
            font-size: 6.8pt;
            line-height: 1.28;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            min-height: 0;
        }

        .steps li {
            counter-increment: s;
            position: relative;
            padding-left: 4.8mm;
        }

        .steps li::before {
            content: counter(s);
            position: absolute;
            left: 0;
            top: 0;
            width: 3.8mm;
            height: 3.8mm;
            border-radius: 50%;
            border: 0.6pt solid #111;
            background: #fff;
            color: #111;
            font-size: 5.8pt;
            font-weight: 900;
            text-align: center;
            line-height: 3.6mm;
        }

        .steps li strong { font-weight: 800; color: #111; }

        .tile-foot {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.9mm;
        }

        .avisos {
            border: 0.6pt solid #bbb;
            border-radius: 2px;
            padding: 0.9mm 1.3mm;
            background: #fff;
            font-size: 6.2pt;
            line-height: 1.2;
            color: #222;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.4mm 1.6mm;
        }

        .avisos-label {
            font-size: 6.2pt;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #111;
        }

        .avisos-item {
            position: relative;
            padding-left: 2.2mm;
            white-space: nowrap;
        }

        .avisos-item::before {
            content: "•";
            position: absolute;
            left: 0;
            font-weight: 900;
        }

        .cupom {
            border: 1.2pt dashed #111;
            border-radius: 2px;
            padding: 1mm 1.4mm;
            background: #fff;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.4mm 1.8mm;
            line-height: 1.15;
        }

        .cupom-label {
            font-size: 6pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #111;
        }

        .cupom-code {
            font-size: 10pt;
            font-weight: 900;
            letter-spacing: 0.06em;
            color: #111;
        }

        .cupom-desc {
            font-size: 6.2pt;
            color: #333;
            flex: 1 1 100%;
        }

        .contato {
            border: 0.8pt solid #111;
            border-radius: 2px;
            padding: 1mm 1.3mm;
            background: #fff;
            display: grid;
            grid-template-columns: 1fr 14mm;
            gap: 1.2mm;
            align-items: center;
            font-size: 6pt;
            color: #222;
            line-height: 1.2;
        }

        .contato-copy strong {
            display: block;
            color: #111;
            font-size: 6.6pt;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 0.4mm;
        }

        .contato-copy p { margin: 0; }

        .contato .wa {
            font-weight: 900;
            font-size: 7.5pt;
            color: #111;
            white-space: nowrap;
        }

        .contato-qr {
            width: 14mm;
            height: 14mm;
            object-fit: contain;
            display: block;
            border: 0.4pt solid #ccc;
        }

        .contato-scan {
            font-size: 5.4pt;
            color: #444;
            margin-top: 0.3mm;
        }
    </style>
</head>
<body>

    <div class="no-print">
        <p><strong>1 folha A4</strong> — 6 cartões (manual + avisos + cupom MEUKIT10 + QR WhatsApp). Sem segunda folha.</p>
        <p style="font-size:12px;color:#555;">Impressão: <strong>Escala 100%</strong> · <strong>Margens: Nenhuma</strong> · fundo branco (economiza tinta). Recorte nas linhas tracejadas.</p>
        <button type="button" onclick="window.print()">Imprimir / Salvar PDF</button>
        <a class="btn secondary" href="manual-instalacao-sensor-tattoo-fix.html">Versão completa (1 por folha)</a>
    </div>

    <div class="sheet-lote" id="sheet-lote" aria-label="Folha com 6 manuais + cupom + WhatsApp"></div>

    <template id="tile-template">
        <article class="tile">
            <header class="tile-head">
                <img src="../../images/brand/logo-esfera.png" alt="">
                <div>
                    <h1>SENSOR <span>TATTOOFIX</span></h1>
                    <p>Manual de instalação · Tecnologia 3N20</p>
                </div>
            </header>

            <div class="tile-body">
                <section class="panel">
                    <h2>Kit</h2>
                    <ul class="kit">
                        <li data-n="1">Lenço com álcool isopropílico</li>
                        <li data-n="2">Lente Sensor TattooFix</li>
                        <li data-n="3">Vidro de potencializador</li>
                        <li data-n="4">Bastão aplicador</li>
                        <li data-n="5">Manual</li>
                    </ul>
                </section>
                <section class="panel">
                    <h2>Passo a passo</h2>
                    <ol class="steps">
                        <li><strong>Limpe</strong> o sensor com o lenço e aguarde secar <strong>10&nbsp;s</strong>.</li>
                        <li><strong>Retire o liner</strong> pela aba; não toque no adesivo.</li>
                        <li>Passe <strong>potencializador</strong> fino no sensor com o bastão.</li>
                        <li><strong>Cole</strong> bem no centro do sensor.</li>
                        <li><strong>Pressão firme</strong> por cerca de <strong>30&nbsp;s</strong>.</li>
                        <li><strong>Cura:</strong> 48&nbsp;h atividade · 72&nbsp;h para molhar.</li>
                    </ol>
                </section>
            </div>

            <footer class="tile-foot">
                <div class="avisos">
                    <span class="avisos-label">Avisos:</span>
                    <span class="avisos-item">Ative a detecção de pulso</span>
                    <span class="avisos-item">Use sempre o carregador original</span>
                    <span class="avisos-item">Cura 48&nbsp;h atividade · 72&nbsp;h para molhar</span>
                </div>
                <div class="cupom">
                    <span class="cupom-label">Cupom</span>
                    <span class="cupom-code">MEUKIT10</span>
                    <span class="cupom-desc">10% de desconto na próxima compra em <strong>www.sensortattoofix.com.br</strong> — digite o código no checkout.</span>
                </div>
                <div class="contato">
                    <div class="contato-copy">
                        <strong>Antes de abrir uma reclamação</strong>
                        <p>Dúvida na instalação ou a lente não funcionou? Fale conosco no WhatsApp — resolvemos rápido (reenvio, troca ou orientação).</p>
                        <p><span class="wa">(11) 91339-4665</span></p>
                        <p class="contato-scan">Aponte a câmera no QR para abrir o chat.</p>
                    </div>
                    <img class="contato-qr" src="../../images/docs/qr-whatsapp-tattoo-fix.png" alt="QR WhatsApp (11) 91339-4665" width="120" height="120">
                </div>
            </footer>
        </article>
    </template>

    <script>
        (function () {
            var tpl = document.getElementById('tile-template');
            var sheet = document.getElementById('sheet-lote');
            for (var i = 0; i < 6; i++) {
                sheet.appendChild(tpl.content.cloneNode(true));
            }
        })();
    </script>

</body>
</html>
